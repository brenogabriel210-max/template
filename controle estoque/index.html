 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - StockFlow Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="brand-center">
            <div class="brand-badge">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h1>StockFlow <span>Pro</span></h1>
            <p>Ambiente operacional e gerencial de estoque</p>
        </div>

        <div class="perfil-switch" role="tablist">
            <button type="button" id="tabGestor" class="perfil-btn active" data-perfil="gestor">
                <i class="fa-solid fa-chart-line"></i>
                <span>Gestor</span>
            </button>
            <button type="button" id="tabFuncionario" class="perfil-btn" data-perfil="funcionario">
                <i class="fa-solid fa-barcode"></i>
                <span>Funcionário</span>
            </button>
        </div>

        <div id="descricaoPerfil" class="perfil-box">
            <strong>Visão do Gestor:</strong> Indicadores, gráficos comparativos (estoque vs. venda), espaço livre, alteração de preços, horário de fechamento, previsão de compra e alertas.
        </div>

        <form id="formLogin" class="stack-form">
            <div class="field">
                <label for="username">Usuário</label>
                <input type="text" id="username" required placeholder="Ex: gestor" autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <div id="erroLogin" class="alert-box alert-erro hidden"></div>

            <button type="submit" id="btnEntrar" class="btn btn-primary btn-block">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span id="labelEntrar">Entrar no Painel do Gestor</span>
            </button>
        </form>

        <footer class="login-demo-creds">
            <span>Gestor: <code>gestor</code> / <code>gestor123</code></span>
            <span>Funcionário: <code>funcionario</code> / <code>func123</code></span>
        </footer>
    </main>

    <script>
        const API_URL = "http://127.0.0.1:5000/api";
        let perfilAtual = "gestor";

        const tabGestor = document.getElementById("tabGestor");
        const tabFuncionario = document.getElementById("tabFuncionario");
        const descricaoPerfil = document.getElementById("descricaoPerfil");
        const labelEntrar = document.getElementById("labelEntrar");
        const inputUser = document.getElementById("username");
        const erroLogin = document.getElementById("erroLogin");

        function escolherPerfil(perfil) {
            perfilAtual = perfil;
            erroLogin.classList.add("hidden");

            if (perfil === "gestor") {
                tabGestor.classList.add("active");
                tabFuncionario.classList.remove("active");
                descricaoPerfil.innerHTML = "<strong>Visão do Gestor:</strong> Indicadores, gráficos comparativos (estoque vs. venda), espaço livre, alteração de preços, horário de fechamento, previsão de compra e alertas.";
                labelEntrar.textContent = "Entrar no Painel do Gestor";
                inputUser.placeholder = "Ex: gestor";
            } else {
                tabFuncionario.classList.add("active");
                tabGestor.classList.remove("active");
                descricaoPerfil.innerHTML = "<strong>Visão do Funcionário:</strong> Conferência de espaços vazios, bipagem de recebimento (faltando/sobrando com foto) e bipagem para área de venda com checagem de preço.";
                labelEntrar.textContent = "Entrar no Modo Funcionário";
                inputUser.placeholder = "Ex: funcionario";
            }
        }

        tabGestor.addEventListener("click", () => escolherPerfil("gestor"));
        tabFuncionario.addEventListener("click", () => escolherPerfil("funcionario"));

        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();
            erroLogin.classList.add("hidden");

            const btn = document.getElementById("btnEntrar");
            btn.disabled = true;

            try {
                const res = await fetch('${API_URL}/login', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        username: inputUser.value.trim(),
                        password: document.getElementById("password").value,
                        perfil_solicitado: perfilAtual
                    })
                });
                const data = await res.json();

                if (!res.ok) {
                    erroLogin.textContent = data.erro || "Falha ao autenticar.";
                    erroLogin.classList.remove("hidden");
                    btn.disabled = false;
                    return;
                }

                window.location.href = "index.html";
            } catch (err) {
                erroLogin.textContent = "Servidor Flask indisponível em 127.0.0.1:5000.";
                erroLogin.classList.remove("hidden");
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
